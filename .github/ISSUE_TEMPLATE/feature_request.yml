name: 功能建议
description: 提出改善律师日常办案体验的建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请描述通用的工作问题，不要上传真实案号、当事人资料、律所内部文件、台账备份或未脱敏截图。

  - type: textarea
    id: problem
    attributes:
      label: 希望解决的工作问题
      description: 请用虚构场景说明现在为什么不方便。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 理想的解决方式
      description: 请优先描述用户会如何操作，不必限定技术实现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方式

  - type: dropdown
    id: frequency
    attributes:
      label: 使用频率
      options:
        - 每天都会遇到
        - 每周会遇到
        - 特定案件类型中会遇到
        - 偶尔会遇到
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认描述和附件中不含真实案件数据、备份或未脱敏截图。
          required: true

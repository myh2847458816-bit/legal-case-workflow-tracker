name: Bug 报告
description: 报告可稳定复现的功能、界面或数据问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## 先保护案件信息
        **不要上传真实案号、当事人资料、主台账、完整备份或未脱敏截图。**
        请从空台账开始，用“某甲公司”和“（2026）测试字1号”等完全虚构的资料重新构造问题。

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 可在发布包名称或 package.json 中查看。
      placeholder: 1.6.3
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - Windows 11 x64
        - Windows 10 x64
        - macOS Apple 芯片
        - macOS Intel
        - 开发环境 / 其他
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 系统版本
      placeholder: 例如 Windows 11 24H2 或 macOS 15.6

  - type: textarea
    id: actual
    attributes:
      label: 实际发生了什么？
      description: 请描述错误现象和对工作的影响，不要粘贴真实案件内容。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 使用虚构数据的复现步骤
      placeholder: |
        1. 新建“某甲公司测试案”
        2. 进入……
        3. 点击……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可附上仅含虚构数据的截图。请不要上传主台账、备份、系统用户目录路径或客户文件。

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认本 Issue 及附件不含真实案号、当事人资料、台账备份或未脱敏截图。
          required: true

        - label: 我已使用完全虚构的数据复现问题。
          required: true
